name: 'AegisCI Security Orchestrator'
description: 'All-in-One DevSecOps Scanner & Enterprise Security Orchestrator (SAST, DAST, Secrets, SCA, IaC, CI Linters, AI Remediation, Plugins).'
author: 'AegisCI'
branding:
  icon: 'shield'
  color: 'purple'

inputs:
  mode:
    description: 'Execution mode: auto (default), pr-check, or deep-scan'
    required: false
    default: 'auto'
  fail-on-severity:
    description: 'Fail pipeline on findings: NONE, LOW, MEDIUM, HIGH, CRITICAL'
    required: false
    default: 'HIGH'
  sast:
    description: 'Enable Static Application Security Testing (Semgrep)'
    required: false
    default: 'true'
  secrets:
    description: 'Enable Secret Detection (Gitleaks)'
    required: false
    default: 'true'
  sca:
    description: 'Enable Software Composition Analysis (Trivy)'
    required: false
    default: 'true'
  iac:
    description: 'Enable Infrastructure-as-Code Auditing (Checkov)'
    required: false
    default: 'true'
  dast:
    description: 'Enable Dynamic Application Security Testing (OWASP ZAP)'
    required: false
    default: 'false'
  dast-target-url:
    description: 'Target web application endpoint URL for DAST scanning'
    required: false
    default: ''
  dast-mode:
    description: 'DAST scan mode: baseline, api, full'
    required: false
    default: 'baseline'
  workflow-audit:
    description: 'Enable CI Workflow Security Audit (Zizmor)'
    required: false
    default: 'true'
  annotations:
    description: 'Emit inline PR code annotations via GitHub Actions workflow commands'
    required: false
    default: 'true'
  ai-remediation:
    description: 'Generate AI-powered code fix patches (.patch)'
    required: false
    default: 'false'
  ai-api-key:
    description: 'API key for AI remediation provider (Gemini / OpenAI)'
    required: false
    default: ''
  ai-provider:
    description: 'AI provider for remediation: gemini, openai, custom'
    required: false
    default: 'gemini'
  plugins-dir:
    description: 'Directory path containing custom executable plugins'
    required: false
    default: '.aegisci/plugins'
  dashboard-url:
    description: 'Centralized Enterprise Dashboard webhook URL'
    required: false
    default: ''
  dashboard-token:
    description: 'Authentication token for Enterprise Dashboard webhook'
    required: false
    default: ''
  vortex:
    description: 'Enable Vortex Threat Intelligence feed queries'
    required: false
    default: 'false'
  vortex-api-url:
    description: 'Vortex API endpoint URL'
    required: false
    default: 'https://api.vortex-threatintel.io/v1'
  vortex-api-key:
    description: 'Vortex API authentication token'
    required: false
    default: ''
  sbom:
    description: 'Generate Software Bill of Materials (SBOM)'
    required: false
    default: 'false'
  sbom-format:
    description: 'SBOM format: cyclonedx-json, spdx-json'
    required: false
    default: 'cyclonedx-json'
  sbom-output:
    description: 'Output destination path for SBOM file'
    required: false
    default: 'sbom.cdx.json'
  target:
    description: 'Directory or repository root to scan'
    required: false
    default: '.'
  output:
    description: 'Destination path for unified SARIF report'
    required: false
    default: 'results.sarif'
  policy-file:
    description: 'Path to custom .aegisci.yml policy rules'
    required: false
    default: '.aegisci.yml'
  upload-sarif:
    description: 'Automatically upload unified SARIF report to GitHub Code Scanning'
    required: false
    default: 'true'

outputs:
  sarif-path:
    description: 'Path to the generated unified SARIF report'
    value: ${{ inputs.output }}
  sbom-path:
    description: 'Path to the generated SBOM file (if enabled)'
    value: ${{ inputs.sbom-output }}

runs:
  using: 'composite'
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        check-latest: true

    - name: Install Gitleaks
      if: ${{ inputs.secrets == 'true' }}
      shell: bash
      run: |
        if ! command -v gitleaks &> /dev/null; then
          echo "Installing Gitleaks..."
          GITLEAKS_VERSION="8.18.4"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks || true
        fi

    - name: Install Semgrep
      if: ${{ inputs.sast == 'true' }}
      shell: bash
      run: |
        if ! command -v semgrep &> /dev/null; then
          echo "Installing Semgrep..."
          python3 -m pip install --upgrade semgrep || pip install --upgrade semgrep || true
        fi

    - name: Install Trivy
      if: ${{ inputs.sca == 'true' || inputs.sbom == 'true' }}
      shell: bash
      run: |
        if ! command -v trivy &> /dev/null; then
          echo "Installing Trivy..."
          TRIVY_VERSION="0.51.0"
          curl -sSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | tar -xz -C /usr/local/bin trivy || true
        fi

    - name: Install Checkov
      if: ${{ inputs.iac == 'true' }}
      shell: bash
      run: |
        if ! command -v checkov &> /dev/null; then
          echo "Installing Checkov..."
          python3 -m pip install --upgrade checkov || pip install --upgrade checkov || true
        fi

    - name: Install Zizmor
      if: ${{ inputs.workflow-audit == 'true' }}
      shell: bash
      run: |
        if ! command -v zizmor &> /dev/null; then
          echo "Installing Zizmor..."
          python3 -m pip install --upgrade zizmor || pip install --upgrade zizmor || true
        fi

    - name: Build AegisCI Orchestrator
      shell: bash
      run: |
        cd ${{ github.action_path }}
        go build -o /tmp/aegisci ./cmd/aegisci

    - name: Run AegisCI Security Suite
      shell: bash
      run: |
        /tmp/aegisci scan \
          --target="${{ inputs.target }}" \
          --output="${{ inputs.output }}" \
          --mode="${{ inputs.mode }}" \
          --fail-on-severity="${{ inputs.fail-on-severity }}" \
          --sast="${{ inputs.sast }}" \
          --secrets="${{ inputs.secrets }}" \
          --sca="${{ inputs.sca }}" \
          --iac="${{ inputs.iac }}" \
          --dast="${{ inputs.dast }}" \
          --dast-target-url="${{ inputs.dast-target-url }}" \
          --dast-mode="${{ inputs.dast-mode }}" \
          --workflow-audit="${{ inputs.workflow-audit }}" \
          --annotations="${{ inputs.annotations }}" \
          --ai-remediation="${{ inputs.ai-remediation }}" \
          --ai-api-key="${{ inputs.ai-api-key }}" \
          --ai-provider="${{ inputs.ai-provider }}" \
          --plugins-dir="${{ inputs.plugins-dir }}" \
          --dashboard-url="${{ inputs.dashboard-url }}" \
          --dashboard-token="${{ inputs.dashboard-token }}" \
          --vortex="${{ inputs.vortex }}" \
          --vortex-api-url="${{ inputs.vortex-api-url }}" \
          --vortex-api-key="${{ inputs.vortex-api-key }}" \
          --sbom="${{ inputs.sbom }}" \
          --sbom-format="${{ inputs.sbom-format }}" \
          --sbom-output="${{ inputs.sbom-output }}" \
          --policy-file="${{ inputs.policy-file }}"

    - name: Upload Unified SARIF to GitHub Code Scanning
      if: ${{ inputs.upload-sarif == 'true' && (always() || success() || failure()) }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.output }}
        category: 'aegisci'
