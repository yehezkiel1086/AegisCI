# ==============================================================================
# AegisCI Policy-as-Code Configuration (.aegisci.yml) - v3.0
# ==============================================================================
version: "3.0"

settings:
  fail_on_unpatched_cves: false # Do not block builds if no vendor patch exists
  max_critical: 0               # Zero tolerance for critical vulnerabilities
  max_high: 2                   # Max allowed high findings before gate failure
  max_medium: 10                # Max allowed medium findings

# List active suppressions with path patterns and optional expiry dates
ignore:
  - id: "G401"
    path: "pkg/legacy/hash.go"
    reason: "Non-cryptographic hash used for caching"
    expires: "2026-12-31"

  - id: "generic-api-key"
    path: "test/fixtures/**"
    reason: "Synthetic dummy tokens in unit test fixtures"
    expires: "2027-01-01"

  - id: "CKV_DOCKER_2"
    path: "Dockerfile*"
    reason: "HEALTHCHECK instruction not needed on temporary job runner images"

  - id: "CVE-2023-44487"
    path: "go.mod"
    reason: "Internal non-HTTP/2 backend service with mitigating upstream proxy"
    expires: "2026-12-31"

  - id: "unpinned-uses"
    path: ".github/workflows/dev-test.yml"
    reason: "Development internal action pinned to branch for testing"

# DAST runtime scan configurations
dast:
  exclude_paths:
    - "/logout"
    - "/admin/reset-db"
    - "/api/v1/billing/charge"

# License compliance policies for open-source dependencies
license_policy:
  banned:
    - "GPL-3.0"
    - "AGPL-3.0"
    - "SSPL"
  allowed:
    - "MIT"
    - "Apache-2.0"
    - "BSD-2-Clause"
    - "BSD-3-Clause"
    - "ISC"

# SCA dependency configurations
sca:
  ignore_dev_dependencies: true
  exclude_packages:
    - "mocha"
    - "jest"

# IaC scanning configuration
iac:
  excluded_frameworks: []

# Vortex Threat Intelligence settings (Opt-in)
vortex:
  enabled: false
  threat_threshold: "HIGH" # NONE, LOW, MEDIUM, HIGH, CRITICAL
